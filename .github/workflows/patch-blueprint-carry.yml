name: Patch blueprint carry position

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move blueprint tube to architect back
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('  function drawPlayer(){')
          end=s.index('\n\n  function render(){', start)
          new=r'''  function drawPlayer(){
            const x=sx(player.x), y=player.y;
            ctx.save();
            ctx.translate(x,y);

            const attacking=player.attackTimer>0;

            // Carry the rolled blueprint diagonally across the BACK when idle/walking.
            // It is drawn before the body so it cannot read as a front-facing object.
            if(!attacking){
              ctx.save();
              ctx.translate(15,22);
              if(player.facing===-1) ctx.scale(-1,1);
              ctx.rotate(-0.92);
              ctx.lineCap='round';
              ctx.strokeStyle='#155f9f';ctx.lineWidth=8;
              ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(20,0);ctx.stroke();
              ctx.strokeStyle='#58aeea';ctx.lineWidth=5;
              ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(18,0);ctx.stroke();
              ctx.fillStyle='#f3f6f8';
              ctx.beginPath();ctx.arc(-14,0,4,0,Math.PI*2);ctx.fill();
              ctx.beginPath();ctx.arc(21,0,4,0,Math.PI*2);ctx.fill();
              ctx.restore();

              // Shoulder strap helps the tube read clearly as back-carried equipment.
              ctx.strokeStyle='#6c4c2d';ctx.lineWidth=2;
              ctx.beginPath();ctx.moveTo(9,15);ctx.lineTo(21,31);ctx.stroke();
            }

            // Architect body sits in front of the back-carried blueprint.
            ctx.fillStyle='#1d2d3c'; ctx.fillRect(6,13,18,23);
            ctx.fillStyle='#e3b18d'; ctx.beginPath(); ctx.arc(15,8,7,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#f2f2f2'; ctx.fillRect(8,19,14,8);
            ctx.fillStyle='#efb13d'; ctx.fillRect(6,0,18,4); ctx.fillRect(10,-4,10,5);
            ctx.fillStyle='#18212a'; ctx.fillRect(7,35,7,9); ctx.fillRect(17,35,7,9);

            if(player.jetpack){
              ctx.fillStyle='#ff6a35'; ctx.fillRect(0,16,6,18);
              if(keys[' ']){
                ctx.fillStyle='#ffd15d';
                ctx.beginPath();
                ctx.moveTo(1,34);ctx.lineTo(5,34);ctx.lineTo(3,48+Math.sin(frame*.5)*4);ctx.fill();
              }
            }

            // Only bring the tube into the hand during the X attack.
            if(attacking){
              const handX=player.facing===1?23:7;
              const handY=23;

              ctx.strokeStyle='#e3b18d';ctx.lineWidth=4;ctx.lineCap='round';
              ctx.beginPath();
              ctx.moveTo(player.facing===1?21:9,21);
              ctx.lineTo(handX,handY);
              ctx.stroke();

              ctx.save();
              ctx.translate(handX,handY);
              if(player.facing===-1) ctx.scale(-1,1);
              const phase=(11-player.attackTimer)/11;
              const swing=-1.15 + phase*2.1;
              ctx.rotate(swing);
              ctx.lineCap='round';
              ctx.strokeStyle='#1f80d4';ctx.lineWidth=7;
              ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(38,0);ctx.stroke();
              ctx.strokeStyle='#eaf6ff';ctx.lineWidth=2;
              ctx.beginPath();ctx.moveTo(4,-2);ctx.lineTo(34,-2);ctx.stroke();
              ctx.fillStyle='#f3f6f8';ctx.beginPath();ctx.arc(39,0,4,0,Math.PI*2);ctx.fill();
              ctx.restore();
            }

            ctx.restore();
          }'''
          s=s[:start]+new+s[end:]
          s=s.replace('<kbd>X</kbd> swing blueprint tube','<kbd>X</kbd> draw / swing blueprint tube')
          p.write_text(s)
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Carry blueprint tube on architect back"
          git push
