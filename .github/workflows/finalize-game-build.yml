name: Finalize Arch in Danger build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-game-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the complete game into index.html
        run: |
          git apply --check .github/patches/boss_features.patch
          git apply .github/patches/boss_features.patch
          python .github/scripts/fix_audio.py
          python .github/scripts/add_mobile_controls.py
          python .github/scripts/ensure_boss_transition.py
          python .github/scripts/tune_jetpack.py

      - name: Verify boss, touch controls, audio and jetpack
        run: |
          grep -q "BOSS LEVEL: EXCAVATOR" index.html
          grep -q "startBossLevel" index.html
          grep -q "mobileControls" index.html
          grep -q "runWithAudio" index.html
          grep -q "player.y < 38" index.html

      - name: Commit finalized game index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Commit complete boss mobile audio and jetpack game"
          git push
